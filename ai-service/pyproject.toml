[project]
name = "ai-service"
version = "1.0.0"
description = "Servicio de IA generativa de los OVA de Gestión de Proyectos Informáticos"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.54",
  "google-genai>=2.31,<3",
  "sqlalchemy>=2.1,<3",
  "psycopg[binary]>=3.3,<4",
  "python-dotenv>=1.2",
]

[dependency-groups]
dev = ["pytest>=9.1", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
