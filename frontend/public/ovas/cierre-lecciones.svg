<text class="dg-t2" x="32" y="88" font-size="13.5"><tspan x="32" dy="0">La integración con</tspan><tspan x="32" dy="17.6">PSE tardó 8 semanas</tspan><tspan x="32" dy="17.6">y no 4</tspan></text>
