<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,sans-serif" role="img" aria-label="Criterios de éxito del proyecto">
<style>.dg-box{fill:#f2f2f7;stroke:#3c3c432e}.dg-card{fill:#fff;stroke:#3c3c434d}.dg-accent{fill:#0066cc}.dg-accent-soft{fill:#0066cc1a;stroke:#0066cc59}.dg-success-soft{fill:#248a3d1f;stroke:#1b7f3759}.dg-warning-soft{fill:#ff950024;stroke:#a3520059}.dg-danger-soft{fill:#d7001517;stroke:#c4001a59}.dg-ai-soft{fill:#7c3aed17;stroke:#7c3aed59}.dg-success{fill:#1b7f37}.dg-warning{fill:#a35200}.dg-danger{fill:#c4001a}.dg-t{fill:#1d1d1f}.dg-t2{fill:#5e5e63}.dg-t3{fill:#86868b}.dg-on{fill:#fff}.dg-ta{fill:#0066cc}.dg-ts{fill:#1b7f37}.dg-tw{fill:#a35200}.dg-td{fill:#c4001a}.dg-line{stroke:#3c3c434d;stroke-width:1.75;fill:none}.dg-flow{stroke:#0066cc;stroke-width:2;fill:none}.dg-head{fill:#0066cc}.dg-head-muted{fill:#86868b}.dg-dash{stroke:#86868b;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.dg-s1{stroke:#2a78d6;stroke-width:3;fill:none}.dg-s2{stroke:#eb6834;stroke-width:3;fill:none}.dg-s3{stroke:#5e5e63;stroke-width:3;fill:none;stroke-dasharray:8 6}.dg-f1{fill:#2a78d6}.dg-f2{fill:#eb6834}.dg-f3{fill:#5e5e63}@media (prefers-color-scheme:dark){.dg-box{fill:#2c2c2e;stroke:#5454588c}.dg-card{fill:#1c1c1e;stroke:#78788099}.dg-accent{fill:#3b9eff}.dg-accent-soft{fill:#3b9eff29;stroke:#3b9eff59}.dg-t{fill:#f5f5f7}.dg-t2{fill:#a1a1a6}.dg-t3{fill:#7c7c80}.dg-on{fill:#001a33}.dg-ta{fill:#3b9eff}.dg-ts{fill:#34d058}.dg-tw{fill:#ffb340}.dg-td{fill:#ff6961}.dg-success{fill:#34d058}.dg-warning{fill:#ffb340}.dg-danger{fill:#ff6961}.dg-line{stroke:#78788099}.dg-flow{stroke:#3b9eff}.dg-head{fill:#3b9eff}}</style>
<rect class="dg-success-soft" x="16" y="16" width="242.7" height="124" rx="16"/>
<circle class="dg-success" cx="42" cy="44" r="14"/>
<text class="dg-on" x="42" y="49" font-size="14" font-weight="700" text-anchor="middle">1</text>
<text class="dg-t" x="64" y="50" font-size="16" font-weight="650">Alcance</text>
<text class="dg-t2" x="34" y="80" font-size="14"><tspan x="34" dy="0">Entregables aceptados</tspan><tspan x="34" dy="18.9">contra sus criterios.</tspan></text>
<rect class="dg-success-soft" x="278.7" y="16" width="242.7" height="124" rx="16"/>
<circle class="dg-success" cx="304.7" cy="44" r="14"/>
<text class="dg-on" x="304.7" y="49" font-size="14" font-weight="700" text-anchor="middle">2</text>
<text class="dg-t" x="326.7" y="50" font-size="16" font-weight="650">Plazo</text>
<text class="dg-t2" x="296.7" y="80" font-size="14"><tspan x="296.7" dy="0">Lanzamiento frente</tspan><tspan x="296.7" dy="18.9">al hito del acta.</tspan></text>
<rect class="dg-success-soft" x="541.3" y="16" width="242.7" height="124" rx="16"/>
<circle class="dg-success" cx="567.3" cy="44" r="14"/>
<text class="dg-on" x="567.3" y="49" font-size="14" font-weight="700" text-anchor="middle">3</text>
<text class="dg-t" x="589.3" y="50" font-size="16" font-weight="650">Costo</text>
<text class="dg-t2" x="559.3" y="80" font-size="14"><tspan x="559.3" dy="0">Costo real frente</tspan><tspan x="559.3" dy="18.9">al presupuesto.</tspan></text>
<rect class="dg-accent-soft" x="16" y="160" width="242.7" height="124" rx="16"/>
<circle class="dg-accent" cx="42" cy="188" r="14"/>
<text class="dg-on" x="42" y="193" font-size="14" font-weight="700" text-anchor="middle">4</text>
<text class="dg-t" x="64" y="194" font-size="16" font-weight="650">Calidad</text>
<text class="dg-t2" x="34" y="224" font-size="14"><tspan x="34" dy="0">Defectos en producción</tspan><tspan x="34" dy="18.9">y disponibilidad.</tspan></text>
<rect class="dg-accent-soft" x="278.7" y="160" width="242.7" height="124" rx="16"/>
<circle class="dg-accent" cx="304.7" cy="188" r="14"/>
<text class="dg-on" x="304.7" y="193" font-size="14" font-weight="700" text-anchor="middle">5</text>
<text class="dg-t" x="326.7" y="194" font-size="16" font-weight="650">Interesados</text>
<text class="dg-t2" x="296.7" y="224" font-size="14"><tspan x="296.7" dy="0">Satisfacción de la</tspan><tspan x="296.7" dy="18.9">gerente y taquilleros.</tspan></text>
<rect class="dg-warning-soft" x="541.3" y="160" width="242.7" height="124" rx="16"/>
<circle class="dg-warning" cx="567.3" cy="188" r="14"/>
<text class="dg-on" x="567.3" y="193" font-size="14" font-weight="700" text-anchor="middle">6</text>
<text class="dg-t" x="589.3" y="194" font-size="16" font-weight="650">Beneficio</text>
<text class="dg-t2" x="559.3" y="224" font-size="14"><tspan x="559.3" dy="0">El 30 % de ventas</tspan><tspan x="559.3" dy="18.9">en línea: se mide</tspan><tspan x="559.3" dy="18.9">después del cierre.</tspan></text>
</svg>
