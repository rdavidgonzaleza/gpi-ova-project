<rect class="dg-warning-soft" x="430" y="246" width="354" height="66" rx="14"/>
<text class="dg-tw" x="446" y="272" font-size="15" font-weight="650">Enchapado en oro</text>
<text class="dg-t2" x="446" y="296" font-size="13.5">Funciones que nadie pidió</text>
