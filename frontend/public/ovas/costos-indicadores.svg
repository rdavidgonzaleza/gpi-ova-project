<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,sans-serif" role="img" aria-label="Indicadores y pronósticos del valor ganado">
<style>.dg-box{fill:#f2f2f7;stroke:#3c3c432e}.dg-card{fill:#fff;stroke:#3c3c434d}.dg-accent{fill:#0066cc}.dg-accent-soft{fill:#0066cc1a;stroke:#0066cc59}.dg-success-soft{fill:#248a3d1f;stroke:#1b7f3759}.dg-warning-soft{fill:#ff950024;stroke:#a3520059}.dg-danger-soft{fill:#d7001517;stroke:#c4001a59}.dg-ai-soft{fill:#7c3aed17;stroke:#7c3aed59}.dg-success{fill:#1b7f37}.dg-warning{fill:#a35200}.dg-danger{fill:#c4001a}.dg-t{fill:#1d1d1f}.dg-t2{fill:#5e5e63}.dg-t3{fill:#86868b}.dg-on{fill:#fff}.dg-ta{fill:#0066cc}.dg-ts{fill:#1b7f37}.dg-tw{fill:#a35200}.dg-td{fill:#c4001a}.dg-line{stroke:#3c3c434d;stroke-width:1.75;fill:none}.dg-flow{stroke:#0066cc;stroke-width:2;fill:none}.dg-head{fill:#0066cc}.dg-head-muted{fill:#86868b}.dg-dash{stroke:#86868b;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.dg-s1{stroke:#2a78d6;stroke-width:3;fill:none}.dg-s2{stroke:#eb6834;stroke-width:3;fill:none}.dg-s3{stroke:#5e5e63;stroke-width:3;fill:none;stroke-dasharray:8 6}.dg-f1{fill:#2a78d6}.dg-f2{fill:#eb6834}.dg-f3{fill:#5e5e63}@media (prefers-color-scheme:dark){.dg-box{fill:#2c2c2e;stroke:#5454588c}.dg-card{fill:#1c1c1e;stroke:#78788099}.dg-accent{fill:#3b9eff}.dg-accent-soft{fill:#3b9eff29;stroke:#3b9eff59}.dg-t{fill:#f5f5f7}.dg-t2{fill:#a1a1a6}.dg-t3{fill:#7c7c80}.dg-on{fill:#001a33}.dg-ta{fill:#3b9eff}.dg-ts{fill:#34d058}.dg-tw{fill:#ffb340}.dg-td{fill:#ff6961}.dg-success{fill:#34d058}.dg-warning{fill:#ffb340}.dg-danger{fill:#ff6961}.dg-line{stroke:#78788099}.dg-flow{stroke:#3b9eff}.dg-head{fill:#3b9eff}}</style>
<rect class="dg-danger-soft" x="16" y="16" width="245.3" height="124" rx="16"/>
<text class="dg-t2" x="34" y="48" font-size="14" font-weight="600">Variación del costo</text>
<text class="dg-t" x="34" y="84" font-size="21" font-weight="700">CV = EV − AC</text>
<text class="dg-t2" x="34" y="118" font-size="13">Negativa: sobrecosto</text>
<rect class="dg-warning-soft" x="277.3" y="16" width="245.3" height="124" rx="16"/>
<text class="dg-t2" x="295.3" y="48" font-size="14" font-weight="600">Variación del cronograma</text>
<text class="dg-t" x="295.3" y="84" font-size="21" font-weight="700">SV = EV − PV</text>
<text class="dg-t2" x="295.3" y="118" font-size="13">Negativa: atraso</text>
<rect class="dg-danger-soft" x="538.7" y="16" width="245.3" height="124" rx="16"/>
<text class="dg-t2" x="556.7" y="48" font-size="14" font-weight="600">Índice de costo</text>
<text class="dg-t" x="556.7" y="84" font-size="21" font-weight="700">CPI = EV / AC</text>
<text class="dg-t2" x="556.7" y="118" font-size="13">&lt; 1: cada peso rinde menos</text>
<rect class="dg-warning-soft" x="16" y="156" width="245.3" height="124" rx="16"/>
<text class="dg-t2" x="34" y="188" font-size="14" font-weight="600">Índice de cronograma</text>
<text class="dg-t" x="34" y="224" font-size="21" font-weight="700">SPI = EV / PV</text>
<text class="dg-t2" x="34" y="258" font-size="13">&lt; 1: se avanza más lento</text>
<rect class="dg-accent-soft" x="277.3" y="156" width="245.3" height="124" rx="16"/>
<text class="dg-t2" x="295.3" y="188" font-size="14" font-weight="600">Estimado a la conclusión</text>
<text class="dg-t" x="295.3" y="224" font-size="21" font-weight="700">EAC = BAC / CPI</text>
<text class="dg-t2" x="295.3" y="258" font-size="13">Costo final si todo sigue igual</text>
<rect class="dg-accent-soft" x="538.7" y="156" width="245.3" height="124" rx="16"/>
<text class="dg-t2" x="556.7" y="188" font-size="14" font-weight="600">Variación a la conclusión</text>
<text class="dg-t" x="556.7" y="224" font-size="21" font-weight="700">VAC = BAC − EAC</text>
<text class="dg-t2" x="556.7" y="258" font-size="13">Cuánto faltará o sobrará</text>
</svg>
