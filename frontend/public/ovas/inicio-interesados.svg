<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,sans-serif" role="img" aria-label="Matriz de poder e interés">
<style>.dg-box{fill:#f2f2f7;stroke:#3c3c432e}.dg-card{fill:#fff;stroke:#3c3c434d}.dg-accent{fill:#0066cc}.dg-accent-soft{fill:#0066cc1a;stroke:#0066cc59}.dg-success-soft{fill:#248a3d1f;stroke:#1b7f3759}.dg-warning-soft{fill:#ff950024;stroke:#a3520059}.dg-danger-soft{fill:#d7001517;stroke:#c4001a59}.dg-ai-soft{fill:#7c3aed17;stroke:#7c3aed59}.dg-success{fill:#1b7f37}.dg-warning{fill:#a35200}.dg-danger{fill:#c4001a}.dg-t{fill:#1d1d1f}.dg-t2{fill:#5e5e63}.dg-t3{fill:#86868b}.dg-on{fill:#fff}.dg-ta{fill:#0066cc}.dg-ts{fill:#1b7f37}.dg-tw{fill:#a35200}.dg-td{fill:#c4001a}.dg-line{stroke:#3c3c434d;stroke-width:1.75;fill:none}.dg-flow{stroke:#0066cc;stroke-width:2;fill:none}.dg-head{fill:#0066cc}.dg-head-muted{fill:#86868b}.dg-dash{stroke:#86868b;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.dg-s1{stroke:#2a78d6;stroke-width:3;fill:none}.dg-s2{stroke:#eb6834;stroke-width:3;fill:none}.dg-s3{stroke:#5e5e63;stroke-width:3;fill:none;stroke-dasharray:8 6}.dg-f1{fill:#2a78d6}.dg-f2{fill:#eb6834}.dg-f3{fill:#5e5e63}@media (prefers-color-scheme:dark){.dg-box{fill:#2c2c2e;stroke:#5454588c}.dg-card{fill:#1c1c1e;stroke:#78788099}.dg-accent{fill:#3b9eff}.dg-accent-soft{fill:#3b9eff29;stroke:#3b9eff59}.dg-t{fill:#f5f5f7}.dg-t2{fill:#a1a1a6}.dg-t3{fill:#7c7c80}.dg-on{fill:#001a33}.dg-ta{fill:#3b9eff}.dg-ts{fill:#34d058}.dg-tw{fill:#ffb340}.dg-td{fill:#ff6961}.dg-success{fill:#34d058}.dg-warning{fill:#ffb340}.dg-danger{fill:#ff6961}.dg-line{stroke:#78788099}.dg-flow{stroke:#3b9eff}.dg-head{fill:#3b9eff}}</style>
<rect class="dg-warning-soft" x="114" y="20" width="322" height="152" rx="16"/>
<text class="dg-tw" x="134" y="60" font-size="17" font-weight="700">Mantener satisfecho</text>
<text class="dg-t2" x="134" y="94" font-size="14"><tspan x="134" dy="0">Consultar en decisiones clave,</tspan><tspan x="134" dy="18.2">sin saturar de detalles.</tspan></text>
<rect class="dg-danger-soft" x="444" y="20" width="322" height="152" rx="16"/>
<text class="dg-td" x="464" y="60" font-size="17" font-weight="700">Gestionar de cerca</text>
<text class="dg-t2" x="464" y="94" font-size="14"><tspan x="464" dy="0">Involucrar siempre: reuniones</tspan><tspan x="464" dy="18.2">frecuentes y decisiones conjuntas.</tspan></text>
<rect class="dg-box" x="114" y="180" width="322" height="152" rx="16"/>
<text class="dg-t2" x="134" y="220" font-size="17" font-weight="700">Monitorear</text>
<text class="dg-t2" x="134" y="254" font-size="14"><tspan x="134" dy="0">Observar con poco esfuerzo</tspan><tspan x="134" dy="18.2">por si su posición cambia.</tspan></text>
<rect class="dg-accent-soft" x="444" y="180" width="322" height="152" rx="16"/>
<text class="dg-ta" x="464" y="220" font-size="17" font-weight="700">Mantener informado</text>
<text class="dg-t2" x="464" y="254" font-size="14"><tspan x="464" dy="0">Comunicar el avance con</tspan><tspan x="464" dy="18.2">regularidad y escuchar.</tspan></text>
<path class="dg-line" d="M94 16 V336"/>
<text class="dg-t2" x="86" y="36" font-size="13" text-anchor="end">Mucho</text>
<text class="dg-t2" x="86" y="336" font-size="13" text-anchor="end">Poco</text>
<text class="dg-t" x="86" y="181" font-size="14" font-weight="650" text-anchor="end">Poder</text>
<path class="dg-line" d="M110 352 H770"/>
<text class="dg-t2" x="110" y="374" font-size="13">Poco</text>
<text class="dg-t2" x="770" y="374" font-size="13" text-anchor="end">Mucho</text>
<text class="dg-t" x="440" y="374" font-size="14" font-weight="650" text-anchor="middle">Interés</text>
</svg>
