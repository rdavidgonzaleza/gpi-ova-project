<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,sans-serif" role="img" aria-label="Cierre del proyecto y cierre de contratos">
<style>.dg-box{fill:#f2f2f7;stroke:#3c3c432e}.dg-card{fill:#fff;stroke:#3c3c434d}.dg-accent{fill:#0066cc}.dg-accent-soft{fill:#0066cc1a;stroke:#0066cc59}.dg-success-soft{fill:#248a3d1f;stroke:#1b7f3759}.dg-warning-soft{fill:#ff950024;stroke:#a3520059}.dg-danger-soft{fill:#d7001517;stroke:#c4001a59}.dg-ai-soft{fill:#7c3aed17;stroke:#7c3aed59}.dg-success{fill:#1b7f37}.dg-warning{fill:#a35200}.dg-danger{fill:#c4001a}.dg-t{fill:#1d1d1f}.dg-t2{fill:#5e5e63}.dg-t3{fill:#86868b}.dg-on{fill:#fff}.dg-ta{fill:#0066cc}.dg-ts{fill:#1b7f37}.dg-tw{fill:#a35200}.dg-td{fill:#c4001a}.dg-line{stroke:#3c3c434d;stroke-width:1.75;fill:none}.dg-flow{stroke:#0066cc;stroke-width:2;fill:none}.dg-head{fill:#0066cc}.dg-head-muted{fill:#86868b}.dg-dash{stroke:#86868b;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.dg-s1{stroke:#2a78d6;stroke-width:3;fill:none}.dg-s2{stroke:#eb6834;stroke-width:3;fill:none}.dg-s3{stroke:#5e5e63;stroke-width:3;fill:none;stroke-dasharray:8 6}.dg-f1{fill:#2a78d6}.dg-f2{fill:#eb6834}.dg-f3{fill:#5e5e63}@media (prefers-color-scheme:dark){.dg-box{fill:#2c2c2e;stroke:#5454588c}.dg-card{fill:#1c1c1e;stroke:#78788099}.dg-accent{fill:#3b9eff}.dg-accent-soft{fill:#3b9eff29;stroke:#3b9eff59}.dg-t{fill:#f5f5f7}.dg-t2{fill:#a1a1a6}.dg-t3{fill:#7c7c80}.dg-on{fill:#001a33}.dg-ta{fill:#3b9eff}.dg-ts{fill:#34d058}.dg-tw{fill:#ffb340}.dg-td{fill:#ff6961}.dg-success{fill:#34d058}.dg-warning{fill:#ffb340}.dg-danger{fill:#ff6961}.dg-line{stroke:#78788099}.dg-flow{stroke:#3b9eff}.dg-head{fill:#3b9eff}}</style>
<rect class="dg-accent-soft" x="16" y="16" width="372" height="276" rx="18"/>
<text class="dg-ta" x="38" y="54" font-size="19" font-weight="700">Cierre del proyecto o fase</text>
<text class="dg-t2" x="38" y="78" font-size="14">Lo que hace el equipo</text>
<rect class="dg-card" x="30" y="98" width="344" height="36" rx="10"/>
<path class="dg-accent" d="M48 111 L53 116 L48 121 L43 116 Z"/>
<text class="dg-t" x="62" y="121" font-size="14.5">Aceptación formal de entregables</text>
<rect class="dg-card" x="30" y="142" width="344" height="36" rx="10"/>
<path class="dg-accent" d="M48 155 L53 160 L48 165 L43 160 Z"/>
<text class="dg-t" x="62" y="165" font-size="14.5">Transferencia a operación</text>
<rect class="dg-card" x="30" y="186" width="344" height="36" rx="10"/>
<path class="dg-accent" d="M48 199 L53 204 L48 209 L43 204 Z"/>
<text class="dg-t" x="62" y="209" font-size="14.5">Lecciones aprendidas</text>
<rect class="dg-card" x="30" y="230" width="344" height="36" rx="10"/>
<path class="dg-accent" d="M48 243 L53 248 L48 253 L43 248 Z"/>
<text class="dg-t" x="62" y="253" font-size="14.5">Liberar al equipo e informe final</text>
<rect class="dg-warning-soft" x="412" y="16" width="372" height="276" rx="18"/>
<text class="dg-tw" x="434" y="54" font-size="19" font-weight="700">Cierre de contratos</text>
<text class="dg-t2" x="434" y="78" font-size="14">Con cada proveedor</text>
<rect class="dg-card" x="426" y="98" width="344" height="36" rx="10"/>
<path class="dg-warning" d="M444 111 L449 116 L444 121 L439 116 Z"/>
<text class="dg-t" x="458" y="121" font-size="14.5">Verificar lo entregado</text>
<rect class="dg-card" x="426" y="142" width="344" height="36" rx="10"/>
<path class="dg-warning" d="M444 155 L449 160 L444 165 L439 160 Z"/>
<text class="dg-t" x="458" y="165" font-size="14.5">Resolver reclamos pendientes</text>
<rect class="dg-card" x="426" y="186" width="344" height="36" rx="10"/>
<path class="dg-warning" d="M444 199 L449 204 L444 209 L439 204 Z"/>
<text class="dg-t" x="458" y="209" font-size="14.5">Último pago y paz y salvo</text>
<rect class="dg-card" x="426" y="230" width="344" height="36" rx="10"/>
<path class="dg-warning" d="M444 243 L449 248 L444 253 L439 248 Z"/>
<text class="dg-t" x="458" y="253" font-size="14.5">Archivar el contrato</text>
<text class="dg-t2" x="400" y="332" font-size="14" text-anchor="middle">Un contrato puede cerrarse antes que el proyecto, pero el proyecto no cierra con contratos abiertos</text>
</svg>
