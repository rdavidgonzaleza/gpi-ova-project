<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,sans-serif" role="img" aria-label="Informe de desempeño con semáforo">
<style>.dg-box{fill:#f2f2f7;stroke:#3c3c432e}.dg-card{fill:#fff;stroke:#3c3c434d}.dg-accent{fill:#0066cc}.dg-accent-soft{fill:#0066cc1a;stroke:#0066cc59}.dg-success-soft{fill:#248a3d1f;stroke:#1b7f3759}.dg-warning-soft{fill:#ff950024;stroke:#a3520059}.dg-danger-soft{fill:#d7001517;stroke:#c4001a59}.dg-ai-soft{fill:#7c3aed17;stroke:#7c3aed59}.dg-success{fill:#1b7f37}.dg-warning{fill:#a35200}.dg-danger{fill:#c4001a}.dg-t{fill:#1d1d1f}.dg-t2{fill:#5e5e63}.dg-t3{fill:#86868b}.dg-on{fill:#fff}.dg-ta{fill:#0066cc}.dg-ts{fill:#1b7f37}.dg-tw{fill:#a35200}.dg-td{fill:#c4001a}.dg-line{stroke:#3c3c434d;stroke-width:1.75;fill:none}.dg-flow{stroke:#0066cc;stroke-width:2;fill:none}.dg-head{fill:#0066cc}.dg-head-muted{fill:#86868b}.dg-dash{stroke:#86868b;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.dg-s1{stroke:#2a78d6;stroke-width:3;fill:none}.dg-s2{stroke:#eb6834;stroke-width:3;fill:none}.dg-s3{stroke:#5e5e63;stroke-width:3;fill:none;stroke-dasharray:8 6}.dg-f1{fill:#2a78d6}.dg-f2{fill:#eb6834}.dg-f3{fill:#5e5e63}@media (prefers-color-scheme:dark){.dg-box{fill:#2c2c2e;stroke:#5454588c}.dg-card{fill:#1c1c1e;stroke:#78788099}.dg-accent{fill:#3b9eff}.dg-accent-soft{fill:#3b9eff29;stroke:#3b9eff59}.dg-t{fill:#f5f5f7}.dg-t2{fill:#a1a1a6}.dg-t3{fill:#7c7c80}.dg-on{fill:#001a33}.dg-ta{fill:#3b9eff}.dg-ts{fill:#34d058}.dg-tw{fill:#ffb340}.dg-td{fill:#ff6961}.dg-success{fill:#34d058}.dg-warning{fill:#ffb340}.dg-danger{fill:#ff6961}.dg-line{stroke:#78788099}.dg-flow{stroke:#3b9eff}.dg-head{fill:#3b9eff}}</style>
<rect class="dg-success-soft" x="16" y="16" width="245.3" height="196" rx="18"/>
<circle class="dg-success" cx="50" cy="52" r="14"/>
<text class="dg-ts" x="74" y="58" font-size="18" font-weight="700">Verde</text>
<text class="dg-t" x="36" y="104" font-size="16" font-weight="650">CPI y SPI ≥ 0,95</text>
<text class="dg-t2" x="36" y="140" font-size="14">Seguir el plan y reportar.</text>
<rect class="dg-warning-soft" x="277.3" y="16" width="245.3" height="196" rx="18"/>
<circle class="dg-warning" cx="311.3" cy="52" r="14"/>
<text class="dg-tw" x="335.3" y="58" font-size="18" font-weight="700">Amarillo</text>
<text class="dg-t" x="297.3" y="104" font-size="16" font-weight="650">Entre 0,85 y 0,95</text>
<text class="dg-t2" x="297.3" y="140" font-size="14"><tspan x="297.3" dy="0">Analizar la causa y vigilar</tspan><tspan x="297.3" dy="18.2">cada semana.</tspan></text>
<rect class="dg-danger-soft" x="538.7" y="16" width="245.3" height="196" rx="18"/>
<circle class="dg-danger" cx="572.7" cy="52" r="14"/>
<text class="dg-td" x="596.7" y="58" font-size="18" font-weight="700">Rojo</text>
<text class="dg-t" x="558.7" y="104" font-size="16" font-weight="650">Menor que 0,85</text>
<text class="dg-t2" x="558.7" y="140" font-size="14"><tspan x="558.7" dy="0">Acción correctiva y aviso</tspan><tspan x="558.7" dy="18.2">al patrocinador.</tspan></text>
<text class="dg-t3" x="400" y="242" font-size="13.5" text-anchor="middle">Los umbrales se acuerdan en el plan, antes de medir</text>
</svg>
