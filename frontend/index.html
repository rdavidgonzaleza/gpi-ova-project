<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Apply the saved appearance before the first paint. Light is the default.
      try {
        if (localStorage.getItem('gpi.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#000000'
        }
      } catch {}
    </script>
    <meta name="description" content="Objetos Virtuales de Aprendizaje con IA para Gestión de Proyectos Informáticos." />
    <title>Hito · Gestión de Proyectos Informáticos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
